# nginx da imagem do emagine.com.br. O HTTPS termina na Cloudflare; aqui chega HTTP do ingress.
server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Health check do Kubernetes (readiness/liveness)
        location = /healthz {
                access_log off;
                default_type text/plain;
                return 200 "ok\n";
        }

        # Arquivos com hash no nome: cache longo
        location /assets/ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                try_files $uri =404;
        }

        # SPA: rotas do React Router caem no index.html (sem cache, para pegar deploys novos)
        location / {
                try_files $uri $uri/ /index.html;
                add_header Cache-Control "no-cache";
        }
}
