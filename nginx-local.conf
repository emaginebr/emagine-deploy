server {
        listen 80 default_server;
        server_name localhost;

        index index.html;

        # emagine.com.br saiu desta imagem (roda no cluster Kubernetes); localmente use
        # `npm run dev` em emagine-site/. Aqui só os subcaminhos dos outros sites.
        location = / {
                default_type text/plain;
                return 404 "emagine-site: use npm run dev em emagine-site/\n";
        }

        location = /monexup {
                return 301 /monexup/;
        }

        location ^~ /monexup/ {
                alias /var/www/monexup.com/home/;
                index index.html;
                try_files $uri $uri/ /index.html;
        }

        location = /pandoravault {
                return 301 /pandoravault/;
        }

        location ^~ /pandoravault/ {
                alias /var/www/pandoravault.com/home/;
                index index.html;
                try_files $uri $uri/ /index.html;
        }

        location = /bazzuca {
                return 301 /bazzuca/;
        }

        location ^~ /bazzuca/ {
                alias /var/www/bazzuca.media/home/;
                index index.html;
                try_files $uri $uri/ /index.html;
        }
}
