server {
        listen 443 ssl;
        server_name         emagine.com.br;
        ssl_certificate     /etc/nginx/ssl/emagine.com.br.chained.crt;
        ssl_certificate_key /etc/nginx/ssl/emagine.com.br.key;

        root /var/www/emagine.com.br/home;
                                                                                                                                                                                    
        index index.html;                                                                                           

        location / {                                                 
                try_files $uri $uri/ =404;                                                                           
        }
        location /auth-api {
                rewrite                 /auth-api/(.*) /$1  break;
                proxy_set_header        Host $host;
                proxy_pass              https://nauth-api1:443/;                                                         
        }
        location /bazzuca-api {
                rewrite                 /bazzuca-api/(.*) /$1  break;
                proxy_set_header        Host $host;
                proxy_pass              https://bazzuca-api1:443/;                                                         
        }
}

server {
        listen 443 ssl;
        server_name         www.emagine.com.br;

        ssl_certificate     /etc/nginx/ssl/emagine.com.br.chained.crt;
        ssl_certificate_key /etc/nginx/ssl/emagine.com.br.key;

        return 301 https://emagine.com.br$request_uri;
}

server {
    listen 80;
    server_name emagine.com.br www.emagine.com.br;
    return 301 https://emagine.com.br$request_uri;
}

