server {
        listen 443 ssl;
        server_name         emagine.com.br;
        ssl_certificate     /etc/nginx/ssl/emagine.com.br.chained.crt;
        ssl_certificate_key /etc/nginx/ssl/emagine.com.br.key;
        client_max_body_size 100M;

        root /var/www/emagine.com.br/home;
                                                                                                                                                                                    
        index index.html;                                                                                           

        location / {                                                 
                try_files $uri $uri/ /index.html;
                error_page 404 403 /index.html;                                                                           
        }
        location = /nauth {
                return 301 /nauth/;
        }

        location ^~ /nauth/ {
                alias /var/www/emagine.com.br/nauth/;
                index index.html;
                try_files $uri $uri/ /nauth/index.html;
        }
        location = /lofn {
                return 301 /lofn/;
        }

        location ^~ /lofn/ {
                alias /var/www/emagine.com.br/lofn/;
                index index.html;
                try_files $uri $uri/ /lofn/index.html;
        }
        location = /proxypay {
                return 301 /proxypay/;
        }

        location ^~ /proxypay/ {
                alias /var/www/emagine.com.br/proxypay/;
                index index.html;
                try_files $uri $uri/ /proxypay/index.html;
        }
        location = /rodrigolandim {
                return 301 /rodrigolandim/;
        }

        location ^~ /rodrigolandim/ {
                alias /var/www/emagine.com.br/rodrigolandim/;
                index index.html;
                try_files $uri $uri/ /rodrigolandim/index.html;
        }
        location = /avachat {
                return 301 /avachat/;
        }

        location ^~ /avachat/ {
                alias /var/www/emagine.com.br/avachat/;
                index index.html;
                try_files $uri $uri/ /avachat/index.html;
        }
        location = /rabbitmq {
                return 301 /rabbitmq/;
        }

        location ^~ /rabbitmq/ {
                rewrite                 /rabbitmq/(.*) /$1  break;
                proxy_set_header        Host $host;
                proxy_set_header        X-Real-IP $remote_addr;
                proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header        X-Forwarded-Proto $scheme;
                proxy_pass              http://emagine-rabbitmq:15672;
        }

        location /auth-api/ {
                rewrite                 /auth-api/(.*) /$1  break;
                proxy_set_header        Host $host;
                proxy_set_header        X-Real-IP $remote_addr;
                proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header        X-Forwarded-Proto $scheme;
                proxy_pass              http://nauth-api:80/;

                # Remove CORS headers from backend to avoid duplicates
                proxy_hide_header 'Access-Control-Allow-Origin';
                proxy_hide_header 'Access-Control-Allow-Methods';
                proxy_hide_header 'Access-Control-Allow-Headers';

                # CORS
                if ($request_method = 'OPTIONS') {
                        add_header 'Access-Control-Allow-Origin' '*' always;
                        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Tenant-Id, X-Device-Fingerprint, User-Agent' always;
                        add_header 'Access-Control-Max-Age' 86400;
                        return 204;
                }
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Tenant-Id, X-Device-Fingerprint, User-Agent' always;
        }
        location /news-api/ {
                rewrite                 /news-api/(.*) /$1  break;
                proxy_set_header        Host $host;
                proxy_set_header        X-Real-IP $remote_addr;
                proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header        X-Forwarded-Proto $scheme;
                proxy_pass              http://nnews-api:80/;

                # Remove CORS headers from backend to avoid duplicates
                proxy_hide_header 'Access-Control-Allow-Origin';
                proxy_hide_header 'Access-Control-Allow-Methods';
                proxy_hide_header 'Access-Control-Allow-Headers';

                # CORS
                if ($request_method = 'OPTIONS') {
                        add_header 'Access-Control-Allow-Origin' '*' always;
                        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Tenant-Id, X-Device-Fingerprint, User-Agent' always;
                        add_header 'Access-Control-Max-Age' 86400;
                        return 204;
                }
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Tenant-Id, X-Device-Fingerprint, User-Agent' always;
        }

        location /lofn-api/ {
                rewrite                 /lofn-api/(.*) /$1  break;
                proxy_set_header        Host $host;
                proxy_set_header        X-Real-IP $remote_addr;
                proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header        X-Forwarded-Proto $scheme;
                proxy_pass              http://lofn-api:80/;

                # Remove CORS headers from backend to avoid duplicates
                proxy_hide_header 'Access-Control-Allow-Origin';
                proxy_hide_header 'Access-Control-Allow-Methods';
                proxy_hide_header 'Access-Control-Allow-Headers';

                # CORS
                if ($request_method = 'OPTIONS') {
                        add_header 'Access-Control-Allow-Origin' '*' always;
                        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Tenant-Id, X-Device-Fingerprint, User-Agent' always;
                        add_header 'Access-Control-Max-Age' 86400;
                        return 204;
                }
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Tenant-Id, X-Device-Fingerprint, User-Agent' always;
        }
        location /pay-api/ {
                rewrite                 /pay-api/(.*) /$1  break;
                proxy_set_header        Host $host;
                proxy_set_header        X-Real-IP $remote_addr;
                proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header        X-Forwarded-Proto $scheme;
                proxy_pass              http://proxypay-api:80/;

                # Remove CORS headers from backend to avoid duplicates
                proxy_hide_header 'Access-Control-Allow-Origin';
                proxy_hide_header 'Access-Control-Allow-Methods';
                proxy_hide_header 'Access-Control-Allow-Headers';

                # CORS
                if ($request_method = 'OPTIONS') {
                        add_header 'Access-Control-Allow-Origin' '*' always;
                        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Tenant-Id, X-Device-Fingerprint, User-Agent' always;
                        add_header 'Access-Control-Max-Age' 86400;
                        return 204;
                }
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Tenant-Id, X-Device-Fingerprint, User-Agent' always;
        }
        location /chat-api/ {
                rewrite                 /chat-api/(.*) /$1  break;
                proxy_set_header        Host $host;
                proxy_set_header        X-Real-IP $remote_addr;
                proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header        X-Forwarded-Proto $scheme;
                proxy_pass              http://avachat-api:80/;

                # Remove CORS headers from backend to avoid duplicates
                proxy_hide_header 'Access-Control-Allow-Origin';
                proxy_hide_header 'Access-Control-Allow-Methods';
                proxy_hide_header 'Access-Control-Allow-Headers';

                # CORS
                if ($request_method = 'OPTIONS') {
                        add_header 'Access-Control-Allow-Origin' '*' always;
                        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Tenant-Id, X-Device-Fingerprint, User-Agent' always;
                        add_header 'Access-Control-Max-Age' 86400;
                        return 204;
                }
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Tenant-Id, X-Device-Fingerprint, User-Agent' always;
        }
        location /bazzuca-api/ {
                rewrite                 /bazzuca-api/(.*) /$1  break;
                proxy_set_header        Host $host;
                proxy_set_header        X-Real-IP $remote_addr;
                proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header        X-Forwarded-Proto $scheme;
                proxy_pass              http://bazzuca-api:80/;

                # Remove CORS headers from backend to avoid duplicates
                proxy_hide_header 'Access-Control-Allow-Origin';
                proxy_hide_header 'Access-Control-Allow-Methods';
                proxy_hide_header 'Access-Control-Allow-Headers';

                # CORS
                if ($request_method = 'OPTIONS') {
                        add_header 'Access-Control-Allow-Origin' '*' always;
                        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Tenant-Id, X-Device-Fingerprint, User-Agent' always;
                        add_header 'Access-Control-Max-Age' 86400;
                        return 204;
                }
                add_header 'Access-Control-Allow-Origin' '*' always;
