server {
        listen 443 ssl;
        server_name         slaproyale.com;
        ssl_certificate     /etc/nginx/ssl/slaproyale.com.chained.crt;
        ssl_certificate_key /etc/nginx/ssl/slaproyale.com.key;

        root /var/www/slaproyale.com/home;
                                                                                                                                                                                    
        index index.html;                                                                                           

        location / {                                                 
                try_files $uri $uri/ =404;                                                                           
        }
        location /metadata/ {
                proxy_set_header        Host $host;
                proxy_pass              https://slap-api1:443/;                                                         
        }
}

server {
        listen 443 ssl;
        server_name         goblinwars.net;
        ssl_certificate     /etc/nginx/ssl/goblinwars.net.chained.crt;
        ssl_certificate_key /etc/nginx/ssl/goblinwars.net.key;

        root /var/www/goblinwars.net/home;
                                                                                                                                                                                    
        index index.html;                                                                                           

        location / {                                                 
                try_files $uri $uri/ =404;                                                                           
        }
        location ^~ /classic/ {         
                alias /var/www/goblinwars.net/classic/;    
                index index.html;                                     
                try_files $uri $uri/ /index.html;                                                                           
        }
}

server {
        listen 443 ssl;
        server_name         monexup.com;
        ssl_certificate     /etc/nginx/ssl/monexup.com.chained.crt;
        ssl_certificate_key /etc/nginx/ssl/monexup.com.key;

        root /var/www/monexup.com/home;
                                                                                                                                                                                    
        index index.html;                                                                                           

        location / {                                                 
                try_files $uri $uri/ =404;                                                                           
        }
}

server {
    listen 80;
    server_name slaproyale.com www.slaproyale.com;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name goblinwars.net www.goblinwars.net;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name monexup.com www.monexup.com;
    return 301 https://$host$request_uri;
}