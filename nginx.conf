server {
        listen 443 ssl;
        server_name         emagine.com.br;
        ssl_certificate     /etc/nginx/ssl/emagine.com.br.pem;
        ssl_certificate_key /etc/nginx/ssl/emagine.com.br.key;
        client_max_body_size 100M;

        # Cloudflare real IP — restaura IP do visitante a partir do header CF-Connecting-IP
        # Ranges oficiais: https://www.cloudflare.com/ips/
        set_real_ip_from 173.245.48.0/20;
        set_real_ip_from 103.21.244.0/22;
        set_real_ip_from 103.22.200.0/22;
        set_real_ip_from 103.31.4.0/22;
        set_real_ip_from 141.101.64.0/18;
        set_real_ip_from 108.162.192.0/18;
        set_real_ip_from 190.93.240.0/20;
        set_real_ip_from 188.114.96.0/20;
        set_real_ip_from 197.234.240.0/22;
        set_real_ip_from 198.41.128.0/17;
        set_real_ip_from 162.158.0.0/15;
        set_real_ip_from 104.16.0.0/13;
        set_real_ip_from 104.24.0.0/14;
        set_real_ip_from 172.64.0.0/13;
        set_real_ip_from 131.0.72.0/22;
        set_real_ip_from 2400:cb00::/32;
        set_real_ip_from 2606:4700::/32;
        set_real_ip_from 2803:f800::/32;
        set_real_ip_from 2405:b500::/32;
        set_real_ip_from 2405:8100::/32;
        set_real_ip_from 2a06:98c0::/29;
        set_real_ip_from 2c0f:f248::/32;
        real_ip_header CF-Connecting-IP;
        real_ip_recursive on;

        root /var/www/emagine.com.br/home;
                                                                                                                                                                                    
        index index.html;                                                                                           

        location / {                                                 
                try_files $uri $uri/ /index.html;
                error_page 404 403 /index.html;                                                                           
        }
        location = /nauth {
                return 301 /nauth/;
        }

        location ^~ /nauth/ {
                root /var/www/emagine.com.br;
                index index.html;
                try_files $uri $uri/ /nauth/index.html;
        }
        location = /lofn {
                return 301 /lofn/;
        }

        location ^~ /lofn/ {
                root /var/www/emagine.com.br;
                index index.html;
                try_files $uri $uri/ /lofn/index.html;
        }
        location = /proxypay {
                return 301 /proxypay/;
        }

        location ^~ /proxypay/ {
                root /var/www/emagine.com.br;
                index index.html;
                try_files $uri $uri/ /proxypay/index.html;
        }
        location = /rodrigolandim {
                return 301 /rodrigolandim/;
        }

        location ^~ /rodrigolandim/ {
                root /var/www/emagine.com.br;
                index index.html;
                try_files $uri $uri/ /rodrigolandim/index.html;
        }
        # location = /rabbitmq {
        #         return 301 /rabbitmq/;
        # }
        #
        # location ^~ /rabbitmq/ {
        #         rewrite                 /rabbitmq/(.*) /$1  break;
        #         proxy_set_header        Host $host;
        #         proxy_set_header        X-Real-IP $remote_addr;
        #         proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        #         proxy_set_header        X-Forwarded-Proto $scheme;
        #         proxy_pass              http://emagine-rabbitmq:15672;
        # }

        location /auth-api/ {
                rewrite                 /auth-api/(.*) /$1  break;
                proxy_set_header        Host $host;
                proxy_set_header        X-Real-IP $remote_addr;
                proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header        X-Forwarded-Proto $scheme;
                proxy_pass              http://nauth-api:80/;

                # Remove CORS headers from backend to avoid duplicates
                proxy_hide_header 'Access-Control-Allow-Origin';
                proxy_hide_header 'Access-Control-Allow-Methods';
                proxy_hide_header 'Access-Control-Allow-Headers';

                # CORS
                if ($request_method = 'OPTIONS') {
                        add_header 'Access-Control-Allow-Origin' '*' always;
                        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Tenant-Id, X-Device-Fingerprint, User-Agent' always;
                        add_header 'Access-Control-Max-Age' 86400;
                        return 204;
                }
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Tenant-Id, X-Device-Fingerprint, User-Agent' always;
        }
        # location /news-api/ {
        #         rewrite                 /news-api/(.*) /$1  break;
        #         proxy_set_header        Host $host;
        #         proxy_set_header        X-Real-IP $remote_addr;
