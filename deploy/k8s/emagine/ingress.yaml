# Roteamento público de emagine.com.br: só a SPA (emagine-web).
# - Sem TLS: o HTTPS termina na Cloudflare e o túnel chega aqui por HTTP.
# - Só o host principal. O www NÃO entra aqui nem no túnel: uma Redirect Rule da Cloudflare faz o
#   301 www → emagine.com.br na borda. Não use `from-to-www-redirect`: atrás do túnel ele gera
#   https://emagine.com.br:80/.
# - As rotas que o servidor antigo atendia neste host (/nauth, /lofn, /proxypay, /rodrigolandim e
#   os proxies /auth-api, /lofn-api, /pay-api) NÃO foram migradas: caem na SPA.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: emagine
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  rules:
    - host: emagine.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: emagine-web
                port:
                  number: 80
