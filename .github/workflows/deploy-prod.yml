name: Deploy Production

on:
  workflow_run:
    workflows: ["Version and Tag"]
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1
      env:
        SECRETS_REPO_TOKEN: ${{ secrets.SECRETS_REPO_TOKEN }}
      with:
        host: ${{ secrets.PROD_SSH_HOST }}
        username: ${{ secrets.PROD_SSH_USER }}
        password: ${{ secrets.PROD_SSH_PASSWORD }}
        port: ${{ secrets.PROD_SSH_PORT || 22 }}
        envs: SECRETS_REPO_TOKEN
        script: |
          set -e

          DEPLOY_DIR="/opt/emagine-deploy"
          REPO_URL="https://github.com/${{ github.repository }}.git"
          BRANCH="main"

          # Clone or update repository
          if [ -d "$DEPLOY_DIR" ]; then
            echo "Updating existing repository..."
            cd "$DEPLOY_DIR"
            git fetch origin
            git reset --hard "origin/$BRANCH"
            git clean -fd
          else
            echo "Cloning repository..."
            git clone --branch "$BRANCH" --single-branch "$REPO_URL" "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"
          fi

          # Clone or update emagine-secrets (repositorio privado — autentica com o token
          # SECRETS_REPO_TOKEN, que so eh usado na URL do comando e nunca fica salvo no .git/config)
          SECRETS_DIR="/root/emagine-secrets"
          SECRETS_BRANCH="main"
          if [ -z "$SECRETS_REPO_TOKEN" ]; then
            echo "ERROR: secret SECRETS_REPO_TOKEN nao configurado"
            exit 1
          fi
          SECRETS_AUTH_URL="https://x-access-token:${SECRETS_REPO_TOKEN}@github.com/emaginebr/emagine-secrets.git"

          if [ -d "$SECRETS_DIR" ] && [ ! -d "$SECRETS_DIR/.git" ]; then
            SECRETS_BACKUP="${SECRETS_DIR}.bak-$(date +%Y%m%d%H%M%S)"
            echo "$SECRETS_DIR existe mas nao eh um repositorio git — movendo para $SECRETS_BACKUP"
            mv "$SECRETS_DIR" "$SECRETS_BACKUP"
          fi

          if [ -d "$SECRETS_DIR/.git" ]; then
            echo "Updating emagine-secrets..."
            git -C "$SECRETS_DIR" fetch --quiet "$SECRETS_AUTH_URL" "$SECRETS_BRANCH"
            git -C "$SECRETS_DIR" reset --hard FETCH_HEAD
          else
            echo "Cloning emagine-secrets..."
            git clone --quiet --branch "$SECRETS_BRANCH" --single-branch "$SECRETS_AUTH_URL" "$SECRETS_DIR"
            git -C "$SECRETS_DIR" remote set-url origin "https://github.com/emaginebr/emagine-secrets.git"
          fi
          unset SECRETS_AUTH_URL SECRETS_REPO_TOKEN
          chmod 700 "$SECRETS_DIR"

          # Verify SSL certificates exist
          if [ ! -d "/root/emagine-secrets/SSL" ]; then
            echo "ERROR: SSL directory /root/emagine-secrets/SSL not found"
            exit 1
          fi

          # Create external network if it doesn't exist
          docker network inspect emagine-network >/dev/null 2>&1 || docker network create emagine-network

          # Deploy with docker compose
          docker compose down
          docker compose up --build -d

          # Wait and verify
          echo "Waiting for services to start..."
          sleep 10
          docker compose ps

          # Aplica restricoes Cloudflare em 80/443 (idempotente; cobre IPv4 e IPv6).
          # O script faz guard da regra SSH (22/tcp), valida o download das faixas
          # antes de tocar no firewall e sai com aviso (exit 0) se o hook do
          # ufw-docker ainda nao tiver sido instalado — nesse caso o deploy nao
          # eh interrompido. Bootstrap do hook eh manual:
          # docs/CF_FIREWALL.md.
          if [ -f scripts/cf-firewall-docker.sh ]; then
            echo "Applying Cloudflare firewall rules..."
            bash scripts/cf-firewall-docker.sh || {
              echo "WARN: cf-firewall-docker.sh falhou (exit $?). Deploy segue."
            }
          else
            echo "WARN: scripts/cf-firewall-docker.sh ausente — pulando."
          fi

          echo "Deployment completed successfully."

    - name: Summary
      run: |
        echo "## Production Deployment" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- Server: \`${{ secrets.PROD_SSH_HOST }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- Branch: \`main\`" >> $GITHUB_STEP_SUMMARY
        echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- Triggered by: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
