name: Deploy Infrastructure

on:
  workflow_dispatch:

env:
  DEPLOY_DIR: /opt/emagine-deploy
  COMPOSE_FILE: docker-compose-infra.yml

jobs:
  setup:
    name: Setup Repository & Network
    runs-on: ubuntu-latest
    steps:
      - name: Prepare server
        uses: appleboy/ssh-action@v1
        env:
          RABBITMQ_USER: ${{ secrets.RABBITMQ_USER }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          WPP_SECRET_KEY: ${{ secrets.WPP_SECRET_KEY }}
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          password: ${{ secrets.PROD_SSH_PASSWORD }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          envs: RABBITMQ_USER,RABBITMQ_PASSWORD,WPP_SECRET_KEY
          script: |
            set -e

            DEPLOY_DIR="/opt/emagine-deploy"
            REPO_URL="https://github.com/${{ github.repository }}.git"
            BRANCH="main"

            if [ -d "$DEPLOY_DIR" ]; then
              echo "Updating existing repository..."
              cd "$DEPLOY_DIR"
              git fetch origin
              git reset --hard "origin/$BRANCH"
              git clean -fd
            else
              echo "Cloning repository..."
              git clone --branch "$BRANCH" --single-branch "$REPO_URL" "$DEPLOY_DIR"
            fi

            docker network inspect emagine-network >/dev/null 2>&1 || docker network create emagine-network

            # Create .env with production secrets
            {
              echo "RABBITMQ_USER=$RABBITMQ_USER"
              echo "RABBITMQ_PASSWORD=$RABBITMQ_PASSWORD"
              echo "WPP_SECRET_KEY=$WPP_SECRET_KEY"
            } > "$DEPLOY_DIR/.env"

  deploy-rabbitmq:
    name: Deploy RabbitMQ
    needs: [setup]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy RabbitMQ
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          password: ${{ secrets.PROD_SSH_PASSWORD }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          envs: DEPLOY_DIR,COMPOSE_FILE
          script: |
            set -e
            cd /opt/emagine-deploy
            docker compose -f docker-compose-infra.yml up -d --force-recreate rabbitmq
            echo "Waiting for RabbitMQ health check..."
            timeout 60 bash -c 'until docker inspect --format="{{.State.Health.Status}}" emagine-rabbitmq 2>/dev/null | grep -q healthy; do sleep 2; done'
            echo "RabbitMQ is healthy."

  deploy-elasticsearch:
    name: Deploy Elasticsearch
    needs: [deploy-rabbitmq]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Elasticsearch
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          password: ${{ secrets.PROD_SSH_PASSWORD }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          script: |
            set -e
            cd /opt/emagine-deploy
            docker compose -f docker-compose-infra.yml up -d --force-recreate elasticsearch
            echo "Waiting for Elasticsearch health check..."
            timeout 120 bash -c 'until docker inspect --format="{{.State.Health.Status}}" emagine-elasticsearch 2>/dev/null | grep -q healthy; do sleep 2; done'
            echo "Elasticsearch is healthy."

  deploy-wppconnect:
    name: Deploy WPP Connect
    needs: [deploy-elasticsearch]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy WPP Connect
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          password: ${{ secrets.PROD_SSH_PASSWORD }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          script: |
            set -e
            cd /opt/emagine-deploy
            docker compose -f docker-compose-infra.yml build wppconnect
            docker compose -f docker-compose-infra.yml up -d --force-recreate wppconnect
            echo "WPP Connect is running."

  verify:
    name: Verify All Services
    needs: [deploy-wppconnect]
    runs-on: ubuntu-latest
    steps:
      - name: Verify services
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          password: ${{ secrets.PROD_SSH_PASSWORD }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          script: |
            set -e
            cd /opt/emagine-deploy
            echo "=== Infrastructure Services Status ==="
            docker compose -f docker-compose-infra.yml ps
            echo ""
            echo "=== Container Health ==="
            for container in emagine-rabbitmq emagine-elasticsearch wppconnect; do
              status=$(docker inspect --format='{{.State.Status}}' "$container" 2>/dev/null || echo "not found")
              echo "$container: $status"
            done

      - name: Summary
        run: |
          echo "## Infrastructure Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Port |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| RabbitMQ | 5672 (AMQP) / 15672 (Management) |" >> $GITHUB_STEP_SUMMARY
          echo "| Elasticsearch | 9200 |" >> $GITHUB_STEP_SUMMARY
          echo "| WPP Connect | 21465 (internal) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Server: \`${{ secrets.PROD_SSH_HOST }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Triggered by: \`${{ github.actor }}\`" >> $GITHUB_STEP_SUMMARY
