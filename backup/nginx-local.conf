# Trecho removido do nginx-local.conf — locations do easysla para dev local.
# Preservado para referência / eventual rollback.
# Originalmente entre as linhas 43–61 do nginx-local.conf.

        location = /easysla {
                return 301 /easysla/;
        }

        location ^~ /easysla/ {
                alias /var/www/easysla.com/home/;
                index index.html;
                try_files $uri $uri/ /index.html;
        }

        location = /easysla-app {
                return 301 /easysla-app/;
        }

        location ^~ /easysla-app/ {
                alias /var/www/easysla.com/app/;
                index index.html;
                try_files $uri $uri/ /index.html;
        }

