# Trecho removido do nginx.conf principal — server blocks do domínio easysla.com.
# Preservado para referência / eventual rollback.
# Originalmente entre as linhas 342–382 do nginx.conf.

server {
        listen 443 ssl;
        server_name         easysla.com;
        ssl_certificate     /etc/nginx/ssl/easysla.com.chained.crt;
        ssl_certificate_key /etc/nginx/ssl/easysla.com.key;

        root /var/www/easysla.com/home;

        index index.html;

        location / {
                try_files $uri $uri/ /index.html;
                error_page 404 403 /index.html;
        }

        location = /app/ {
                alias /var/www/easysla.com/app/;
                index index.html;
                try_files $uri $uri/ /index.html;
        }

        location ^~ /app {
                alias /var/www/easysla.com/app/;
                index index.html;
                try_files $uri $uri/ /index.html;
        }
}

server {
        listen 443 ssl;
        server_name         www.easysla.com;
        ssl_certificate     /etc/nginx/ssl/easysla.com.chained.crt;
        ssl_certificate_key /etc/nginx/ssl/easysla.com.key;
        return 301 https://easysla.com$request_uri;
}

server {
        listen 80;
        server_name easysla.com www.easysla.com;
        return 301 https://easysla.com$request_uri;
}

