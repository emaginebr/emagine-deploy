<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="img/favicon.png" type="image/png">
  <title>Goblin Wars</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>

body {
  margin: 0;
  position: relative;
  min-height: 100vh;
  overflow: hidden;

   display: flex;
  flex-direction: column;
}

.bg-slideshow {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  z-index: -2;
}

.bg-image {
  position: absolute;
  width: 100%;
  height: 100%;
  background-size: cover;
  background-position: center;
  opacity: 0;
  transition: opacity 2s ease-in-out;
}

.bg1 {
  z-index: 1;
}

.bg2 {
  z-index: 2;
}

/* escurecimento por cima */
body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0, 0, 0, 0.6);
  z-index: -1;
}

    .main-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

.portal-card, .portal-card2 {
  width: 400px;
  height: 400px;
  border-radius: 50%;
  overflow: hidden;
  position: relative;
  text-align: center;
  transition: transform 0.3s;
  z-index: 1;
}

/* Borda com imagem circular ao redor */
.portal-card::before {
  content: "";
  position: absolute;
  top: -8px;
  left: -8px;
  right: -8px;
  bottom: -8px;
  background: url('img/circulo_classic.png') no-repeat center center;
  background-size: contain;
  border-radius: 50%;
  z-index: -1;
}
.portal-card2::before {
  content: "";
  position: absolute;
  top: -8px;
  left: -8px;
  right: -8px;
  bottom: -8px;
  background: url('img/circulo_reborn.png') no-repeat center center;
  background-size: contain;
  border-radius: 50%;
  z-index: -1;
}

    .portal-card:hover, .portal-card2:hover {
      transform: scale(1.05);
    }

    .portal-image {
      width: 75%;
      height: 100%;
      object-fit: contain;
      
    }

    .portal-content {
      position: absolute;
      bottom: 10px;
      left: 0;
      right: 0;
      padding: 0 1rem;
    }

    .portal-title {
      font-size: 1.2rem;
      font-weight: bold;
      color: white;
      text-shadow: 1px 1px 5px black;
    }

    .portal-btn {
      margin-top: 0.5rem;
      font-size: 1rem;
      width: 100%;
    }

    footer {
      text-align: center;
      padding: 1rem;
      background-color: rgba(0, 0, 0, 0.6);
      color: white;
    }
  </style>
</head>
<body>

<div class="bg-slideshow">
    <div class="bg-image bg1"></div>
    <div class="bg-image bg2"></div>
  </div>


  <div class="main-content container text-center">
    <div class="row justify-content-center g-4">
      <!-- Portal 1 -->
      <div class="col-12 col-md-6 d-flex justify-content-center">
        <div class="portal-card">
          <img src="img/GoblinWars-Classic_branco.png" title="Goblin Wars - Classic" class="portal-image">
          <div class="portal-content">
            
            <a href="/classic" title="Learn more about the game" target="_blank" class="btn btn-success portal-btn"><b>START</b></a>
          </div>
        </div>
      </div>

      <!-- Portal 2 -->
      <div class="col-12 col-md-6 d-flex justify-content-center">
        <div class="portal-card2">
          <img src="img/GoblinWars_Reborn.png" title="Goblin Wars - Reborn" class="portal-image">
          <div class="portal-content">
            
            <a href="/reborn" title="Learn more about the game" target="_blank" class="btn btn-warning portal-btn"><b>START</b></a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer>
    Copyright © <span class="text-warning"><b>Goblin Wars</b></span> All Rights Reserved
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
  const images = ['img/bg_01.jpg', 'img/bg_02.jpg', 'img/bg_03.jpg'];
  let current = 0;
  let next = 1;

  const bg1 = document.querySelector('.bg1');
  const bg2 = document.querySelector('.bg2');

  bg1.style.backgroundImage = `url('${images[current]}')`;
  bg1.style.opacity = 1;

  setInterval(() => {
    const nextImage = images[next];
    
    bg2.style.backgroundImage = `url('${nextImage}')`;
    bg2.style.opacity = 1;

    // Fade out o bg1
    setTimeout(() => {
      bg1.style.backgroundImage = `url('${nextImage}')`;
      bg2.style.opacity = 0;
    }, 2000); // tempo igual ao transition (2s)

    current = next;
    next = (next + 1) % images.length;
  }, 8000); // troca a cada 8 segundos
</script>
</body>
</html>
